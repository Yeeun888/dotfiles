# vim:fileencoding=utf-8:foldmethod=marker

# BEGIN_KITTY_FONTS
font_family      family='JetBrainsMono Nerd Font Mono' postscript_name=JetBrainsMonoNFM-Regular
bold_font        auto
italic_font      auto
bold_italic_font auto

# END_KITTY_FONTS

font_size 13.5

# Cursor Stuff
cursor_shape underline
cursor_underline_thickness 2.0
cursor_blink_interval 0.5
cursor_trail 1

# Stop cursor issues with ZSH
shell_integration no-cursor

# Window configurations
window_margin_width     5
background_image        ~/.config/kitty/wallpaper.jpg
background_image_layout cscaled
background_tint         0.97
background_tint_gaps    0.9

single_window_margin_width 0

window_border_width     1pt
active_border_color     #e6db74
inactive_border_color   #888888

# Tab Style
tab_bar_style powerline
tab_powerline_style round

# QOL Changes
auto_reload_config 0.1
macos_option_as_alt yes

# KEY BINDING ENLARGE
# Key bindings for splits layout
map ctrl+shift+4 launch --location=split
map ctrl+shift+5 launch --location=hsplit
map ctrl+shift+6 launch --location=vsplit
map ctrl+shift+7 layout_action rotate 

# Keybindings for vim-kitty-navigator
map ctrl+h neighboring_window left
map ctrl+j neighboring_window down
map ctrl+k neighboring_window up
map ctrl+l neighboring_window right
map --when-focus-on var:IS_VIM=true ctrl+h
map --when-focus-on var:IS_VIM=true ctrl+j
map --when-focus-on var:IS_VIM=true ctrl+k
map --when-focus-on var:IS_VIM=true ctrl+l

# font keybindings
map cmd+equal change_font_size all +0.5
map cmd+minus change_font_size all -0.5

allow_remote_control yes
listen_on unix:/tmp/mykitty    #macos

# Include for custom theme by langolf
include monokai-pro.conf
